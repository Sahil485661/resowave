  <rect x="10" y="7" width="3" height="18" rx="1.5" fill="url(#resowave-green-gradient)" />
  <rect x="15" y="4" width="3" height="24" rx="1.5" fill="url(#resowave-green-gradient)" />
  <rect x="20" y="8" width="3" height="16" rx="1.5" fill="url(#resowave-green-gradient)" />
